name: Deploy BEE to Azure Static Web Apps

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: swa-bee-aserdargun-com-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies and browser
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Validate kernel, lifecycle, static artifact and browser workflows
        run: npm run validate:codex
      - name: Deploy verified static artifact
        id: deploy
        uses: Azure/static-web-apps-deploy@4d27395796ac319302594769cfe812bd207490b1 # v1 branch, verified 2026-09-06
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_SWA_BEE_ASERDARGUN_COM }}
          action: upload
          app_location: out
          api_location: ""
          output_location: ""
          skip_app_build: true
          skip_api_build: true
          is_static_export: true
          production_branch: main
      - name: Verify deployed commit and browser workflows
        env:
          BEE_BASE_URL: ${{ steps.deploy.outputs.static_web_app_url }}
        run: |
          node scripts/verify-production.mjs
          npm run test:e2e
